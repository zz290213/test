<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的测评馆 · 灵魂探索</title>
<style>
  :root {
    --bg-color: #141210;
    --card-bg: #1e1b18;
    --primary: #d4af37;
    --primary-light: #f3e5ab;
    --text-main: #f0e6d2;
    --text-sub: #9a8c76;
    --border: #3d3226;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-color); color: var(--text-main); min-height: 100vh;
    display: flex; justify-content: center; padding: 30px 16px;
  }
  .container {
    width: 100%; max-width: 440px;
  }
  .header {
    text-align: center; margin-bottom: 40px;
  }
  .header h1 {
    font-size: 26px; color: var(--primary-light); font-weight: 700; letter-spacing: 2px; margin-bottom: 10px;
  }
  .header p {
    font-size: 13px; color: var(--text-sub); letter-spacing: 1px;
  }
  
  .list {
    display: flex; flex-direction: column; gap: 16px;
  }
  
  /* 单个测试的卡片样式 */
  .card {
    display: flex; align-items: center;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; text-decoration: none; color: var(--text-main);
    transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--primary); opacity: 0; transition: opacity 0.3s;
  }
  .card:active { transform: scale(0.98); background: rgba(255,255,255,0.03); }
  .card:hover::before { opacity: 1; }
  
  .card-icon {
    width: 50px; height: 50px; border-radius: 12px;
    background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin-right: 16px; flex-shrink: 0;
  }
  .card-content {
    flex: 1;
  }
  .card-title {
    font-size: 16px; font-weight: 600; color: var(--primary-light); margin-bottom: 4px;
  }
  .card-desc {
    font-size: 12px; color: var(--text-sub); line-height: 1.5;
  }
  .card-arrow {
    color: var(--primary); font-size: 18px; margin-left: 10px; opacity: 0.5;
  }
  
  .footer {
    text-align: center; margin-top: 50px; font-size: 11px; color: #555; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔮 灵魂测评馆</h1>
    <p>每一次选择，都在拼凑真实的你</p>
  </div>

  <div class="list">
    
    <!-- 1. 你的名著测试 -->
    <!-- 注意：href 后面填你名著测试的 html 文件名 -->
    <a href="literary-test.html" class="card">
      <div class="card-icon">📖</div>
      <div class="card-content">
        <div class="card-title">测测你是哪本名著里的谁</div>
        <div class="card-desc">10 道灵魂拷问，解锁你的文学原型与隐藏人格。</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <!-- 2. 以后新增的测试，直接复制上面这段 <a> 标签改一下字就行 -->
    <!-- 
    <a href="love-test.html" class="card">
      <div class="card-icon">❤️</div>
      <div class="card-content">
        <div class="card-title">你的恋爱隐藏人格</div>
        <div class="card-desc">测测你的依恋类型和恋爱脑指数。</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
    -->

  </div>

  <div class="footer">
    * 本主页所有测试均基于文学/心理学原型生成，仅供娱乐。<br>点击卡片即可开始测试。
  </div>
</div>

</body>
</html>
