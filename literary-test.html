<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你是哪本名著里的谁</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --bg:#141210; --card:#1e1b18; --pri:#d4af37; --pri-l:#f3e5ab; --txt:#f0e6d2; --sub:#9a8c76; --bor:#3d3226; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
  .app { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--bor); border-radius: 24px; padding: 36px 24px; min-height: 580px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .hidden { display:none !important; }
  .cover { text-align:center; position:relative; z-index:1; }
  .cover h1 { font-size:30px; line-height:1.4; color:var(--txt); margin-bottom:16px; }
  .cover .sub { font-size:14px; color:var(--sub); line-height:1.8; margin-bottom:40px; }
  .btn { display:block; width:100%; padding:16px; border:none; border-radius:14px; background: linear-gradient(135deg, var(--pri), #b38e28); color:#141210; font-size:17px; font-weight:800; cursor:pointer; }
  .quiz { position:relative; z-index:1; }
  .progress-text { font-size:12px; color:var(--pri); margin-bottom:10px; text-align:right; font-weight:600; }
  .progress-bar { height:6px; background:var(--bor); border-radius:3px; overflow:hidden; margin-bottom:30px;}
  .progress-fill { height:100%; width:6.6%; background:var(--pri); transition:width .3s; }
  .q-title { font-size:19px; line-height:1.6; color:var(--txt); margin-bottom:24px; font-weight:600;}
  .options { display:flex; flex-direction:column; gap:12px; }
  .option { padding:16px 18px; border:1.5px solid var(--bor); border-radius:14px; font-size:14px; color:#c4b7a3; cursor:pointer; background:rgba(255,255,255,0.02); transition:all .2s;}
  .option:active, .option.selected { border-color:var(--pri); background:rgba(212,175,55,0.1); color:var(--pri-l); transform: scale(0.98);}
  .result { text-align:center; position:relative; z-index:1; animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .result .avatar { width:100px; height:100px; border-radius:50%; margin:0 auto 20px; background:var(--bg); border:2px solid var(--pri); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:var(--pri-l); }
  .result h2 { font-size:28px; color:var(--pri-l); margin-bottom:8px; font-weight:700;}
  .result .label { font-size:14px; color:var(--pri); margin-bottom:24px; font-weight:600;}
  .result-card { background:rgba(255,255,255,0.03); border: 1px solid var(--bor); border-radius: 16px; padding: 20px; text-align: left; margin-bottom: 20px; }
  .result-card h3 { font-size: 14px; color: var(--pri); margin-bottom: 8px; font-weight:600;}
  .result-card p { font-size: 14px; line-height: 1.8; color: #b8ac98; margin-bottom: 16px; }
  .result-card p:last-child { margin-bottom: 0; }
  .quote { font-size: 13px; font-style: italic; color: var(--pri-l); border-left: 3px solid var(--pri); padding-left: 12px; margin: 20px 0; text-align: left; line-height:1.6;}
  .disclaimer { font-size:11px; color:#6b6050; margin-bottom:24px; }
  .action-btns { display: flex; gap: 12px; }
  .btn-save { flex: 1; background: var(--pri); border: none; color: var(--bg); font-size:15px; padding:15px; border-radius:14px; font-weight:700; cursor:pointer;}
  .btn-again { flex: 1; background:transparent; border:1.5px solid var(--bor); color:var(--sub); font-size:15px; padding:15px; border-radius:14px; cursor:pointer;}
  
  /* 隐藏海报区 */
  #poster-container { position: absolute; top: -9999px; left: -9999px; z-index: -1; }
</style>
</head>
<body>
<div class="app">
  <div id="cover" class="cover">
    <div style="font-size:12px; letter-spacing:5px; color:var(--pri); margin-bottom:20px;">L I T E R A R Y</div>
    <h1>测测你是<br>哪本名著里的谁</h1>
    <p class="sub">15 道直击灵魂的选择题<br>20 种文学巨匠原型，看看你骨子里住着谁</p>
    <button class="btn" onclick="startQuiz()">开启灵魂测试</button>
  </div>

  <div id="quiz" class="quiz hidden">
    <div class="progress-text" id="progressText">1 / 15</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="q-title" id="qTitle"></div>
    <div class="options" id="options"></div>
  </div>

  <div id="result" class="result hidden">
    <div class="avatar" id="rAvatar"></div>
    <h2 id="rName"></h2>
    <div class="label" id="rLabel"></div>
    <div class="result-card">
      <h3>灵魂画像</h3><p id="rDesc"></p>
      <h3>你的高光</h3><p id="rStrength"></p>
      <h3>潜在盲区</h3><p id="rWeakness"></p>
    </div>
    <div class="quote" id="rQuote"></div>
    <p class="disclaimer">* 本测试基于文学原型理论生成，仅供娱乐。</p>
    <div class="action-btns">
      <button class="btn-save" id="saveBtn" onclick="generatePoster()">生成图片</button>
      <button class="btn-again" onclick="restart()">再测一次</button>
    </div>
  </div>
</div>

<!-- 生成海报的模板 -->
<div id="poster-container">
  <div id="poster" style="width: 375px; padding: 40px 30px; background: linear-gradient(160deg, #1e1b18, #141210); border-radius: 20px; box-sizing: border-box; position: relative;">
    <div style="text-align: center; color: #d4af37; font-size: 12px; letter-spacing: 3px; margin-bottom: 20px; font-weight: bold;">LITERARY TEST</div>
    <div id="p-avatar" style="width: 80px; height: 80px; border-radius: 50%; background: #2a241d; border: 2px solid #d4af37; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: #f3e5ab; font-size: 28px; font-weight: bold;"></div>
    <div id="p-name" style="text-align: center; color: #f3e5ab; font-size: 24px; font-weight: bold; margin-bottom: 5px;"></div>
    <div id="p-label" style="text-align: center; color: #d4af37; font-size: 13px; margin-bottom: 25px;"></div>
    <div id="p-quote" style="font-size: 14px; color: #f0e6d2; font-style: italic; text-align: center; line-height: 1.6; margin-bottom: 25px; padding: 8px 10px; border-left: 2px solid #d4af37; border-right: 2px solid #d4af37;"></div>
    <div style="border-top: 1px dashed #3d3226; margin-bottom: 20px;"></div>
    <div style="text-align: center; font-size: 12px; color: #9a8c76; margin-bottom: 25px;">
      <p style="margin-bottom: 5px;">长按识别二维码，测测你的隐藏灵魂</p>
      <div style="width: 60px; height: 60px; background: #333; margin: 0 auto; border-radius: 4px; color: #666; font-size: 10px; line-height: 60px;">二维码</div>
    </div>
  </div>
</div>

<script>
const questions = [
  { q: "朋友深夜找你倾诉糟心事，你的第一反应是？", opts: [ { t: "陪她一起难过，自己也想哭", k: ["林黛玉","贾宝玉"] }, { t: "冷静帮她理清下一步怎么做", k: ["简·爱","福尔摩斯","诸葛亮"] }, { t: "“谁欺负你了？我去算账”", k: ["孙悟空","鲁智深","武松"] }, { t: "安静听完，问最让她难受的点", k: ["唐僧","甘地"] }, { t: "盘算这件事怎么处理最有利", k: ["曹操","王熙凤"] }, { t: "讲离谱故事让她觉得人生本就荒诞", k: ["堂吉诃德","李白"] } ] },
  { q: "走进全是陌生人的聚会，你通常会？", opts: [ { t: "角落坐下，默默观察", k: ["林黛玉","简·爱"] }, { t: "主动找一两个人聊，不合适就撤", k: ["福尔摩斯","郭靖"] }, { t: "加入最热闹的一堆，先玩再说", k: ["孙悟空","王熙凤"] }, { t: "站旁边听，分析关系网", k: ["诸葛亮","曹操"] }, { t: "判断谁最有分量，找机会认识", k: ["于连","曹操"] }, { t: "跟谁都能聊，聊自己痴迷的事", k: ["堂吉诃德","李白"] }] },
  { q: "遇到很想做但所有人说不靠谱的事，你会？", opts: [ { t: "纠结很久放弃，但心里惦记", k: ["林黛玉","哈姆雷特"] }, { t: "偷偷准备，有把握再拿出来", k: ["简·爱","诸葛亮"] }, { t: "不试试怎么知道，先干了再说", k: ["孙悟空","鲁智深"] }, { t: "列清风险和收益再决定", k: ["福尔摩斯","曹操"] }, { t: "评估能否积累资源话语权，能就干", k: ["王熙凤","于连"] }, { t: "不需要别人认可，哪怕看起来傻", k: ["堂吉诃德","李白"] }] },
  { q: "你最受不了身边的人哪种行为？", opts: [ { t: "冷漠，不在意别人情绪", k: ["林黛玉","贾宝玉"] }, { t: "虚伪，当面一套背后一套", k: ["简·爱","武松"] }, { t: "磨叽，能动手非要开会", k: ["孙悟空","鲁智深"] }, { t: "蠢，同样的问题反复犯", k: ["福尔摩斯","诸葛亮"] }, { t: "没野心，有机会却退缩", k: ["曹操","于连"] }, { t: "太现实，张口闭口钱和利益", k: ["堂吉诃德","李白"] }] },
  { q: "如果明天不用上班/上学，你最想怎么过？", opts: [ { t: "窝在家里看老电影或小说", k: ["林黛玉","哈姆雷特"] }, { t: "约一两个知己，安静地方坐坐", k: ["简·爱","郭靖"] }, { t: "临时起意去没去过的地方", k: ["孙悟空","李白"] }, { t: "整理积压事情，研究感兴趣的东西", k: ["福尔摩斯","诸葛亮"] }, { t: "约有用的人吃饭，聊下周推进的事", k: ["曹操","王熙凤"] }, { t: "做一件别人觉得没用但我想做的事", k: ["堂吉诃德","李白"] }] },
  { q: "别人对你的评价，哪句你最愿意认领？", opts: [ { t: "你很懂人，也很容易受伤", k: ["林黛玉","贾宝玉"] }, { t: "你看起来好说话，其实有原则", k: ["简·爱","郭靖"] }, { t: "你这个人活得很带劲", k: ["孙悟空","鲁智深"] }, { t: "你想得比一般人多，也更冷静", k: ["福尔摩斯","诸葛亮"] }, { t: "你很清楚自己要什么，且拿得到", k: ["曹操","于连"] }, { t: "你活在另一个有趣的世界里", k: ["堂吉诃德","李白"] }] },
  { q: "当团队里出现分歧大家吵得不可开交时，你通常会？", opts: [ { t: "先不讲话，等情绪过去再私下聊", k: ["林黛玉","简·爱"] }, { t: "列出观点，找折中方案", k: ["郭靖","唐僧"] }, { t: "直接拍板：先按这个干，不行再改", k: ["孙悟空","武松"] }, { t: "听完逻辑漏洞，最后一次性指出", k: ["福尔摩斯","诸葛亮"] }, { t: "看谁的意见会赢，提前站队推进", k: ["曹操","王熙凤"] }, { t: "提出大家都没想到的第三种可能", k: ["堂吉诃德","李白"] }] },
  { q: "你更相信哪一种力量？", opts: [ { t: "共情。能感受到别人的感受", k: ["林黛玉","贾宝玉"] }, { t: "原则。守住底线才能被尊重", k: ["简·爱","武松"] }, { t: "行动。想再多不如先干一票", k: ["孙悟空","鲁智深"] }, { t: "理性。情绪会骗人，逻辑不会", k: ["福尔摩斯","诸葛亮"] }, { t: "掌控。掌握规则谁说了算", k: ["曹操","王熙凤"] }, { t: "信念。别人觉得可笑我也信", k: ["堂吉诃德","唐僧"] }] },
  { q: "如果让你选一个词形容自己，你会选？", opts: [ { t: "细腻", k: ["林黛玉","哈姆雷特"] }, { t: "清醒", k: ["简·爱","福尔摩斯"] }, { t: "痛快", k: ["孙悟空","武松"] }, { t: "冷静", k: ["诸葛亮","福尔摩斯"] }, { t: "野心", k: ["曹操","于连"] }, { t: "痴迷", k: ["堂吉诃德","李白"] }] },
  { q: "多年以后，你希望别人怎么记住你？", opts: [ { t: "一个真正懂人的人", k: ["林黛玉","唐僧"] }, { t: "一个不依附谁的独立者", k: ["简·爱","武松"] }, { t: "一个敢打敢冲活得尽兴的人", k: ["孙悟空","鲁智深"] }, { t: "一个判断最准的智者", k: ["福尔摩斯","诸葛亮"] }, { t: "一个改变规则做大局面的人", k: ["曹操","王熙凤"] }, { t: "一个认真追逐荒唐梦的人", k: ["堂吉诃德","李白"] }] },
  { q: "面对绝对不公的规则，你会？", opts: [ { t: "心里悲愤，但默默忍受", k: ["林黛玉","哈姆雷特"] }, { t: "按规则找漏洞，智取", k: ["福尔摩斯","诸葛亮"] }, { t: "直接把桌子掀了", k: ["孙悟空","武松","鲁智深"] }, { t: "带着弱者一起反抗", k: ["简·爱","郭靖"] }, { t: "利用规则为自己谋最大利益", k: ["曹操","于连"] }, { t: "坚持自己心中的道义底线", k: ["唐僧","堂吉诃德"] }] },
  { q: "如果遭遇了重大的情感背叛，你会？", opts: [ { t: "绝望心碎，很久走不出来", k: ["林黛玉","哈姆雷特"] }, { t: "决绝离开，绝不回头", k: ["简·爱","武松"] }, { t: "当面质问，甚至不惜动手", k: ["孙悟空","鲁智深"] }, { t: "收集证据，让对方付出代价", k: ["曹操","福尔摩斯","王熙凤"] }, { t: "反思自己，选择原谅和包容", k: ["唐僧","郭靖"] }, { t: "相信那是命运开的荒诞玩笑", k: ["堂吉诃德","李白"] }] },
  { q: "你如何看待金钱与权力？", opts: [ { t: "没感觉，精神契合最重要", k: ["林黛玉","贾宝玉"] }, { t: "要独立，钱是底气", k: ["简·爱","于连"] }, { t: "是拿来打破束缚的工具", k: ["孙悟空","武松"] }, { t: "是社会运转的底层逻辑", k: ["福尔摩斯","曹操","诸葛亮"] }, { t: "是必须要赢的游戏", k: ["王熙凤","于连"] }, { t: "身外之物，不值一提", k: ["堂吉诃德","李白","唐僧"] }] },
  { q: "朋友找你借一笔不小的钱，你会？", opts: [ { t: "心疼对方，直接借", k: ["贾宝玉","唐僧"] }, { t: "量力而行，救急不救穷", k: ["简·爱","郭靖"] }, { t: "“我的钱也不是大风刮来的”", k: ["王熙凤","于连"] }, { t: "写个借条，约定利息和归还日期", k: ["曹操","诸葛亮"] }, { t: "一码归一码，打听清楚原因再说", k: ["福尔摩斯","哈姆雷特"] }, { t: "看心情，豪气地请客或借出", k: ["孙悟空","鲁智深","李白"] }] },
  { q: "你觉得自己身上最矛盾的一点是？", opts: [ { t: "渴望被懂又害怕被看透", k: ["林黛玉","哈姆雷特"] }, { t: "外表随和内心极度挑剔", k: ["简·爱","福尔摩斯"] }, { t: "明明很要强却容易心软", k: ["孙悟空","武松"] }, { t: "想掌控一切又嫌麻烦", k: ["曹操","王熙凤"] }, { t: "理想主义却又渴望世俗成功", k: ["于连","堂吉诃德"] }, { t: "觉得人间无聊又想济世救人", k: ["李白","唐僧","郭靖"] }] }
];

const results = {
  "林黛玉": { avatar:"黛", label: "敏感细腻型 · 红楼一梦", desc: "你把感受放在第一位，有着极高的情感分辨率。别人眼里的小事，会在你心里泛起很久的涟漪。", strength: "极高的共情力与艺术直觉，你懂人性的幽微，能提供深度的情绪价值。", weakness: "容易陷入精神内耗。有时候，钝感力是你需要学习的课题。", quote: "“我就是个多愁多病身，你就是那倾国倾城貌。”" },
  "贾宝玉": { avatar:"宝", label: "多情温柔型 · 怡红公子", desc: "你对世界充满悲悯，特别是对女性和弱者。你讨厌世俗的功名利禄，只想在温柔乡里守护真情。", strength: "极高的同理心与包容度。你身上有着最纯粹的人性光辉，让人想靠近。", weakness: "缺乏现实的执行力，遇到挫折容易逃避。该扛责任时，需要更勇敢一点。", quote: "“女儿是水作的骨肉，男人是泥作的骨肉。”" },
  "简·爱": { avatar:"简", label: "清醒独立型 · 灵魂平等", desc: "你看起来温和，骨子里却有很硬的底线。你可以妥协，但不会为了讨好谁而丢掉自己。", strength: "强大的内核与自尊。无论身处何种逆境，你都有重新站起来的底气。", weakness: "有时过于倔强，可能会把真正关心你的人推远。适度的柔软并非软弱。", quote: "“你以为我穷、低微、不美，就没有灵魂没有心吗？”" },
  "孙悟空": { avatar:"悟", label: "不服就干型 · 齐天大圣", desc: "你受不了磨叽和弯弯绕绕。看到问题就想解决，看到不公就想站出来，崇尚自由与实力。", strength: "敢想敢做，永远充满生命力。在困境中，你往往是最先找到出路的那个人。", weakness: "容易因为太直接而碰壁，缺乏耐心。有时候慢一点、绕一步，战力反而更强。", quote: "“皇帝轮流做，明年到我家。”" },
  "福尔摩斯": { avatar:"福", label: "冷静观察型 · 推理至上", desc: "你习惯先观察再行动。人群里你话不多，但脑子里一直在转，你只相信逻辑与证据。", strength: "极强的理性思维与专注力。在混乱中，你总能一眼看穿事物的本质。", weakness: "可能显得缺乏人情味，让人觉得有距离感。并非所有问题都能用逻辑解决。", quote: "“排除一切不可能，剩下的即使再不可思议，那也是真相。”" },
  "曹操": { avatar:"曹", label: "掌控野心型 · 乱世枭雄", desc: "你天生对局面敏感。别人看到的是人和事，你看到的是资源和位置。你不喜欢被安排，更愿意自己定规则。", strength: "卓越的统筹力与决断力。你能团结各方力量，去达成一个宏大的目标。", weakness: "掌控欲过强容易让身边人感到压抑。偶尔放下目的，去享受无用的快乐。", quote: "“宁教我负天下人，休教天下人负我。”" },

let current = 0;
let scores = {};
Object.keys(results).forEach(k => scores[k] = 0);
let isAnimating = false;
let currentResultKey = "林黛玉";

function startQuiz() {
  current = 0;
  Object.keys(results).forEach(k => scores[k] = 0);
  document.getElementById("cover").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById("progressText").textContent = (current + 1) + " / " + questions.length;
  document.getElementById("progressFill").style.width = ((current + 1) / questions.length * 100) + "%";
  document.getElementById("qTitle").textContent = q.q;

  const box = document.getElementById("options");
  box.innerHTML = "";
  q.opts.forEach(function(opt) {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt.t;
    div.onclick = function() { choose(opt.k, div); };
    box.appendChild(div);
  });
}

function choose(keys, el) {
  if (isAnimating) return;
  isAnimating = true;
  el.classList.add("selected");
  
  keys.forEach(k => { if(scores[k] !== undefined) scores[k]++; });
  
  setTimeout(() => {
    current++;
    if (current < questions.length) {
      renderQuestion();
      isAnimating = false;
    } else {
      showResult();
      isAnimating = false;
    }
  }, 250); 
}

function showResult() {
  let best = Object.keys(scores)[0];
  let max = scores[best];
  for (const k in scores) {
    if (scores[k] > max) { max = scores[k]; best = k; }
  }
  currentResultKey = best;
  const r = results[best];
  
  document.getElementById("rAvatar").textContent = r.avatar;
  document.getElementById("rName").textContent = best;
  document.getElementById("rLabel").textContent = r.label;
  document.getElementById("rDesc").textContent = r.desc;
  document.getElementById("rStrength").textContent = r.strength;
  document.getElementById("rWeakness").textContent = r.weakness;
  document.getElementById("rQuote").textContent = r.quote;

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
}

function generatePoster() {
  const btn = document.getElementById("saveBtn");
  btn.textContent = "生成中...";
  const r = results[currentResultKey];
  document.getElementById("p-avatar").textContent = r.avatar;
  document.getElementById("p-name").textContent = currentResultKey;
  document.getElementById("p-label").textContent = r.label;
  document.getElementById("p-quote").textContent = r.quote;

  // 确保在手机端截图时，DOM已经完全渲染
  setTimeout(() => {
    html2canvas(document.getElementById("poster"), { 
      scale: 2, 
      useCORS: true, 
      backgroundColor: "#141210",
      allowTaint: true 
    }).then(canvas => {
      const imgData = canvas.toDataURL("image/jpeg", 0.9);
      
      const overlay = document.createElement("div");
      overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;";
      
      const img = document.createElement("img");
      img.src = imgData;
      img.style.cssText = "width:80%;max-width:375px;border-radius:12px;box-shadow: 0 10px 30px rgba(0,0,0,0.5);";
      
      const tip = document.createElement("div");
      tip.textContent = "长按上方图片保存到相册";
      tip.style.cssText = "color:#d4af37;margin-top:20px;font-size:16px;font-weight:bold;";
      
      const closeBtn = document.createElement("div");
      closeBtn.textContent = "✕ 关闭";
      closeBtn.style.cssText = "position:absolute;top:20px;right:20px;color:#fff;font-size:14px;padding:10px;";
      closeBtn.onclick = () => document.body.removeChild(overlay);

      overlay.appendChild(img);
      overlay.appendChild(tip);
      overlay.appendChild(closeBtn);
      document.body.appendChild(overlay);
      btn.textContent = "生成图片";
    }).catch(err => {
      console.error(err);
      alert("图片生成失败，请直接截图保存～");
      btn.textContent = "生成图片";
    });
  }, 100);
}

function restart() {
  document.getElementById("result").classList.add("hidden");
  document.getElementById("cover").classList.remove("hidden");
}
</script>
